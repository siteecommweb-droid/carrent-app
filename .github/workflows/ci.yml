name: AM38 CI

on:
  push:
    branches:
      - main
      - FULL-RECOVERY

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend
        working-directory: backend
        run: npm install

      - name: Install Frontend
        working-directory: frontend/carrent-frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend/carrent-frontend
        run: npm run build
