name: AM38 Deploy

on:
  push:
    branches:
      - FULL-RECOVERY

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Install frontend
        run: |
          cd frontend/carrent-frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend/carrent-frontend
          npm run build
